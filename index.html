<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="footer"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        function loadComponent(id, path) {
            fetch(path)
                .then(res => res.text())
                .then((text) => {
                    const doc = new DOMParser().parseFromString(text, "text/html");
                    document.getElementById(id).innerHTML = doc.body.innerHTML;
                    lucide.createIcons();
                });
        }
        loadComponent("header", "/components/header/header.html");
        loadComponent("footer", "/components/footer/footer.html");
        loadComponent("hero", "/components/hero/hero.html");
    </script>
</body>

</html>
