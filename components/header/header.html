<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Bebas+Neue&family=Hanuman:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
    </style>
</head>

<body>
    <div
        class="w-[390px] h-[64px] bg-[rgba(246,251,245,0.85)] flex justify-between items-center xl:w-[1280px] h-[64px] mx-auto dark:bg-[rgba(26,28,27,0.9)]">
        <div class="flex gap-[4px] justify-center items-center xl:gap-[12px]">
            <img class="w-[32px] h-[32px] ml-[24px] xl:ml-[48px];" src="logo.png" alt="">
            <div class="">
                <h1 class="text-[rgba(141,75,0,1)] font-[500] text-[22px] leading-[27.5px] font-[Plus+Jakarta+Sans]">Dog
                    Explorer</h1>
                <div
                    class="text-[rgba(85,67,54,1)] font-[300] text-[11px] leading-[11px] font-[Plus+Jakarta+Sans] xl:hidden">
                    Discover</div>
            </div>
        </div>
        <div class="hidden w-[288px] h-[32px] xl:flex justify-center items-center gap-[20px]">
            <div class="text-[rgba(85,67,54,1)] text-[14px] leading-[20px] font-[Plus+Jakarta+Sans]">Discover</div>
            <div class="text-[rgba(85,67,54,1)] text-[14px] leading-[20px] font-[Plus+Jakarta+Sans]">Breeds</div>
            <div class="text-[rgba(85,67,54,1)] text-[14px] leading-[20px] font-[Plus+Jakarta+Sans]">Gallery</div>
        </div>
        <div class="flex gap-3 justify-center items-center mr-[34px] xl: mr-[58px];">
            <i class="xl:hidden" data-lucide="user-round-search"></i>
            <i data-lucide="sun"></i>
        </div>
    </div>





    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
